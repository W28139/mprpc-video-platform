# SchedulerService docker 配置（阶段 13）
# 与 video_platform/conf/scheduler.conf 的差异：
#   rpcserverip=0.0.0.0 / host 全部改为 compose 服务名
#   ffmpeg_work_dir=/data/output —— 产物写入挂载卷，宿主可直接访问
rpcserverip=0.0.0.0
rpcserverport=9002
zookeeperip=zookeeper
zookeeperport=2181

# ── Shard 切分配置 ──────────────────────────────────────────────────
shard_duration_sec=15             # 每 shard 的视频时长（秒），用户未指定时使用此默认值
job_duration_fallback_sec=60      # ffprobe 探测失败时的回退时长（秒），兼容非视频输入
# ffmpeg_work_dir 用于生成 shard 的 output_path，实际写文件的是 Worker；
# 分布式部署（Scheduler/Worker 异机）时该目录必须为共享文件系统
ffmpeg_work_dir=/data/output      # 默认输出目录（job 未指定 output_path 时使用）

rpcserverio_threads=2
rpcserverwork_threads=2

# ── MySQL 持久化（阶段 9）─────────────────────────────────────────────
mysqlhost=mysql
mysqlport=3306
mysqluser=video_platform
mysqlpassword=video_platform123
mysqldbname=video_platform
mysql_pool_size=4

# ── Redis（阶段 10，可降级：故障时自动回退本地缓存/RPC） ──
redis_enable=1
redis_host=redis
redis_port=6379

# ── RabbitMQ（阶段 10，可降级：故障时回退 Pull 轮询/直连 RPC） ──
mq_enable=1
mq_host=rabbitmq
mq_port=5672

# ── Prometheus metrics（阶段 11，metrics_port<=0 关闭） ──
metrics_port=9092
