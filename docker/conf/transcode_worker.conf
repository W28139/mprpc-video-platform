# TranscodeWorker docker 配置（阶段 13）
# 与 video_platform/conf/transcode_worker_9004.conf 的差异：
#   rpcserverip=0.0.0.0 / host 改为 compose 服务名
#   不写 worker_id —— 阶段 13 起 worker_id 解析优先级：
#       环境变量 WORKER_ID > 配置 worker_id > 容器 hostname（天然唯一）
#      docker compose up --scale transcode_worker=N 时，各副本 hostname 不同，
#      自动得到 N 个唯一 worker_id，无需手动指定。

# ── RPC Provider 监听地址 ──────────────────────────────────────────────
rpcserverip=0.0.0.0
rpcserverport=9004

# ── ZooKeeper 连接 ─────────────────────────────────────────────────────
zookeeperip=zookeeper
zookeeperport=2181

# ── 线程数（测试环境调小，生产环境可调大） ────────────────────────────
rpcserverio_threads=2          # IO 工作线程（默认 16）
rpcserverwork_threads=2        # 业务处理线程（默认自动检测）

# ── Worker 注册信息 ────────────────────────────────────────────────────
# worker_id 由 hostname 兜底解析（见文件头注释），此处不再显式配置
cpu_cores=4                   # 机器 CPU 逻辑核心数（上报给调度器）
memory_mb=8192                # 机器总内存（MB）
max_running_shards=2          # 允许的最大并发 shard 数

# ── 阶段 6：Executor 模式选择 ─────────────────────────────────────────────
executor_mode=ffmpeg
ffmpeg_work_dir=/data/output  # FFmpeg 工作目录（切片/转码/合并输出，挂载卷直达宿主）

# ── RabbitMQ（阶段 10，可降级：故障时结果上报回退直连 RPC） ──
mq_enable=1
mq_host=rabbitmq
mq_port=5672

# ── Prometheus metrics（阶段 11，metrics_port<=0 关闭） ──
metrics_port=9095
