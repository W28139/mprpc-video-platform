# JobService docker 配置（阶段 13）
# 与 video_platform/conf/job_service.conf 的差异：
#   rpcserverip=0.0.0.0    —— 容器内绑定所有网卡，供其他容器/宿主访问
#   zookeeperip=zookeeper  —— compose 服务名
#   mysqlhost=mysql        —— compose 服务名
#   redis_host=redis       —— compose 服务名
rpcserverip=0.0.0.0
rpcserverport=9001
zookeeperip=zookeeper
zookeeperport=2181

rpcserverio_threads=2
rpcserverwork_threads=2

# ── MySQL 持久化（阶段 9）─────────────────────────────────────────────
mysqlhost=mysql
mysqlport=3306
mysqluser=video_platform
mysqlpassword=video_platform123
mysqldbname=video_platform
mysql_pool_size=4

# ── Redis（阶段 10，可降级：故障时自动回退本地缓存/RPC） ──
redis_enable=1
redis_host=redis
redis_port=6379

# ── Prometheus metrics（阶段 11，metrics_port<=0 关闭） ──
metrics_port=9091
