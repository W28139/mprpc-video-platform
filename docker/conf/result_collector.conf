# ResultCollectorService docker 配置（阶段 13）
# 与 video_platform/conf/result_collector.conf 的差异：
#   rpcserverip=0.0.0.0 / host 全部改为 compose 服务名
#   ffmpeg_work_dir=/data/output —— 合并产物写入挂载卷，宿主可直接访问
rpcserverip=0.0.0.0
rpcserverport=9005
zookeeperip=zookeeper
zookeeperport=2181
ffmpeg_work_dir=/data/output

rpcserverio_threads=2
rpcserverwork_threads=2

# ── MySQL 持久化（阶段 9）─────────────────────────────────────────────
mysqlhost=mysql
mysqlport=3306
mysqluser=video_platform
mysqlpassword=video_platform123
mysqldbname=video_platform
mysql_pool_size=4

# ── Redis（阶段 10，可降级：故障时自动回退本地缓存/RPC） ──
redis_enable=1
redis_host=redis
redis_port=6379

# ── RabbitMQ（阶段 10，可降级：故障时回退 Pull 轮询/直连 RPC） ──
mq_enable=1
mq_host=rabbitmq
mq_port=5672

# ── Prometheus metrics（阶段 11，metrics_port<=0 关闭） ──
metrics_port=9094
