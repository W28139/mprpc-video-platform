rpcserverip=127.0.0.1
rpcserverport=9002
zookeeperip=127.0.0.1
zookeeperport=2181

# ── Shard 切分配置 ──────────────────────────────────────────────────
shard_duration_sec=15             # 每 shard 的视频时长（秒），用户未指定时使用此默认值
job_duration_fallback_sec=60      # ffprobe 探测失败时的回退时长（秒），兼容非视频输入
ffmpeg_work_dir=/tmp/transcode_worker  # 默认输出目录（job 未指定 output_path 时使用）

rpcserverio_threads=2
rpcserverwork_threads=2
