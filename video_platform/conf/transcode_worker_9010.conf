# TranscodeWorker 配置 — worker_002
#
# 此进程同时承担两个角色：
#   1. Provider — 接收 Scheduler 的 AssignShard / CancelShard / QueryShard 命令
#   2. Consumer — 向 WorkerManager 注册并通过心跳维持在线状态

# ── RPC Provider 监听地址 ──────────────────────────────────────────────
rpcserverip=127.0.0.1
rpcserverport=9010

# ── ZooKeeper 连接 ─────────────────────────────────────────────────────
zookeeperip=127.0.0.1
zookeeperport=2181

# ── 线程数 ────────────────────────────────────────────────────────────
rpcserverio_threads=2          # IO 线程（代码默认 2；控制面 RPC 负载低，无需调大）
rpcserverwork_threads=2        # 业务线程（代码默认 2；ffmpeg 跑在独立执行线程，不占业务池）
ffmpeg_threads=2               # 每个 ffmpeg 转码进程的编码线程数（-threads，0=不限制）
                               # 总编码线程 ≈ max_running_shards × ffmpeg_threads，建议 ≤ 本机核数一半


# ── Worker 注册信息 ────────────────────────────────────────────────────
worker_id=worker_002          # 全局唯一 Worker 标识（重启时保持不变）
# cpu_cores / memory_mb 缺省时自动探测本机资源（/proc），显式指定则优先
cpu_cores=8                   # 机器 CPU 逻辑核心数（上报给调度器）
memory_mb=16384               # 机器总内存（MB）
max_running_shards=4          # 允许的最大并发 shard 数
ffmpeg_work_dir=/tmp/transcode_worker  # FFmpeg 工作目录（切片/转码/合并输出）

# ── 转码参数已移至 JobInfo → ShardInfo 透传（阶段 6 遗留项 2） ────────────
# target_resolution / target_bitrate 由客户端提交 Job 时指定，
# 经 Scheduler → ShardInfo → Worker 全链路透传，Worker 不再从本地配置读取。


# ── RabbitMQ（阶段 10，可降级：故障时结果上报回退直连 RPC） ──
mq_enable=1
mq_host=127.0.0.1
mq_port=5672

# ── Prometheus metrics（阶段 11，metrics_port<=0 关闭） ──
metrics_port=9096
