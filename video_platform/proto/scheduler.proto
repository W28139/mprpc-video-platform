syntax = "proto3";

package video_platform;

import "common.proto";

option cc_generic_services = true;

// SchedulerService — 任务调度与切分

message ScheduleJobRequest {
    JobInfo job_info = 1;
}

message ScheduleJobResponse {
    int32  error_code  = 1;
    string error_msg   = 2;
    bool   accepted    = 3;
    string job_id      = 4;
    int32  shard_count = 5;
    repeated ShardInfo shards = 6;
}

// 重调度失败 shard（Worker 超时/失败触发）
message RescheduleShardRequest {
    string shard_id   = 1;
    string job_id     = 2;
    string reason     = 3;
    string attempt_id = 4;  // 幂等校验：仅当前 attempt 匹配时处理
}

message RescheduleShardResponse {
    int32  error_code = 1;
    string error_msg  = 2;
    bool   accepted   = 3;
}

// WorkerManager 心跳超时通知
message NotifyWorkerOfflineRequest {
    string worker_id = 1;
    string reason    = 2;
}

message NotifyWorkerOfflineResponse {
    int32  error_code        = 1;
    string error_msg         = 2;
    int32  rescheduled_count = 3;
}

// JobService.CancelJob 触发，取消 job 所有 shard
message CancelJobShardsRequest {
    string job_id = 1;
    string reason = 2;
}

message CancelJobShardsResponse {
    int32  error_code     = 1;
    string error_msg      = 2;
    int32  total_shards   = 3;
    int32  notified_count = 4;
    int32  skipped_count  = 5;
}

service SchedulerService {
    rpc ScheduleJob(ScheduleJobRequest) returns (ScheduleJobResponse);
    rpc RescheduleShard(RescheduleShardRequest) returns (RescheduleShardResponse);
    rpc NotifyWorkerOffline(NotifyWorkerOfflineRequest) returns (NotifyWorkerOfflineResponse);
    rpc CancelJobShards(CancelJobShardsRequest) returns (CancelJobShardsResponse);
}