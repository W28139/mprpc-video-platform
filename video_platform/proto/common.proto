syntax = "proto3";

package video_platform;

// 任务生命周期：PENDING → SCHEDULING → RUNNING → SUCCESS/FAILED/CANCELED
enum JobStatus {
    JOB_STATUS_UNKNOWN = 0;
    JOB_PENDING        = 1;
    JOB_SCHEDULING     = 3;
    JOB_RUNNING        = 4;
    JOB_SUCCESS        = 6;
    JOB_FAILED         = 7;
    JOB_CANCELED       = 8;
}

// Shard 生命周期：WAITING → RUNNING → SUCCESS/FAILED/CANCELED
enum ShardStatus {
    SHARD_STATUS_UNKNOWN = 0;
    SHARD_WAITING        = 2;
    SHARD_RUNNING        = 4;
    SHARD_SUCCESS        = 5;
    SHARD_FAILED         = 6;
    SHARD_CANCELED       = 8;
}

enum WorkerStatus {
    WORKER_STATUS_UNKNOWN = 0;
    WORKER_ONLINE         = 1;
    WORKER_OFFLINE        = 2;
}

message JobInfo {
    string job_id             = 1;
    string user_id            = 2;
    string input_path         = 3;
    string output_path        = 4;
    string target_format      = 5;
    string target_resolution  = 6;
    int32  target_bitrate     = 7;
    int64  duration_sec       = 8;
    int32  priority           = 9;
    JobStatus status          = 10;
    int32  shard_count        = 11;
    int64  created_at         = 12;
    int64  updated_at         = 13;
    int32  shard_duration_sec = 14;
}

message ShardInfo {
    string shard_id           = 1;
    string job_id             = 2;
    int32  shard_index        = 3;
    int64  start_ms           = 4;
    int64  duration_ms        = 5;
    ShardStatus status        = 6;
    string assigned_worker_id = 7;
    string attempt_id         = 8;
    int32  retry_count        = 9;
    int32  max_retry          = 10;
    string input_path         = 11;
    string output_path        = 12;
    int64  created_at         = 13;
    int64  updated_at         = 14;
    string target_resolution  = 15;
    int32  target_bitrate     = 16;
}

message WorkerInfo {
    string worker_id              = 1;
    string ip                     = 2;
    int32  port                   = 3;
    int32  cpu_cores              = 4;
    int32  memory_mb              = 5;
    int32  gpu_count              = 6;
    int32  current_running_shards = 7;
    int32  max_running_shards     = 8;
    WorkerStatus status           = 9;
    int64  last_heartbeat         = 10;
    int32  cpu_usage              = 11;
    int32  memory_usage           = 12;
}

message WorkerLoad {
    string worker_id       = 1;
    int32  cpu_usage       = 2;
    int32  memory_usage    = 3;
    int32  running_shards  = 4;
}