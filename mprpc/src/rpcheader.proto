syntax = "proto3";

package mprpc;

// RPC 错误码定义：涵盖了从网络层到协议层，再到服务治理层的常见错误
enum RpcErrorCode
{
    RPC_SUCCESS = 0;                    // 成功
    RPC_BAD_REQUEST = 1;                // 错误请求（格式或参数非法）
    RPC_HEADER_PARSE_FAILED = 2;        // RPC 头部解析失败（通常是 RPC 协议头损坏）
    RPC_SERVICE_NOT_FOUND = 3;          // 找不到服务（Provider 端未注册该 Service）
    RPC_METHOD_NOT_FOUND = 4;           // 找不到方法（Service 中没有该 Method）
    RPC_REQUEST_PARSE_FAILED = 5;       // 请求体解析失败（Protobuf 反序列化业务参数出错）
    RPC_RESPONSE_SERIALIZE_FAILED = 6;  // 响应序列化失败（Provider 端无法打包结果）
    
    // 客户端常见网络错误
    RPC_CONNECT_FAILED = 7;             // TCP 连接失败
    RPC_SEND_FAILED = 8;                // 发送数据失败
    RPC_RECV_FAILED = 9;                // 接收数据失败
    RPC_RESPONSE_PARSE_FAILED = 10;     // 响应解析失败（客户端解析回复时出错）
    
    // 进阶功能错误
    RPC_TIMEOUT = 11;                   // RPC 调用超时
    RPC_FRAME_TOO_LARGE = 12;           // 数据包过大（防止恶意包攻击或内存溢出）
    RPC_INVALID_RESPONSE = 13;          // 非法响应（收到的数据不符合协议规范）
    RPC_SERVICE_DISCOVERY_FAILED = 14;  // 服务发现失败（Zookeeper 中找不到对应节点）
}

// RPC 请求头：用于描述一次 RPC 调用的元数据
message RpcHeader
{
    bytes service_name = 1;    // 调用的服务名 (例如: VideoTranscoderService)
    bytes method_name = 2;     // 调用的方法名 (例如: StartTranscode)
    uint32 args_size = 3;      // 紧跟在 Header 后的业务参数（Payload）的长度
    
    // 核心高级字段
    uint64 request_id = 4;     // 请求序列号：用于在异步环境下匹配 Response 和 Request
    bytes trace_id = 5;        // 全局链路追踪 ID：用于全链路日志查询（微服务必备）
    uint64 deadline_ms = 6;    // 截止时间戳/超时时间：告知 Provider 该请求何时失效，避免无效计算
}

// RPC 响应头：用于描述返回结果的状态
message RpcResponseHeader
{
    uint64 request_id = 1;     // 对应请求的 request_id
    RpcErrorCode error_code = 2; // 框架层面的错误码
    bytes error_msg = 3;       // 详细错误描述信息
    uint32 response_size = 4;  // 紧跟在 ResponseHeader 后的业务返回数据长度
}