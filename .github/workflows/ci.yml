# ============================================================================
# 阶段 13：CI/CD — GitHub Actions
#
#   build       编译全部二进制（ENABLE_NATIVE_MARCH=OFF，与 Docker 一致）
#   unit-test   单元测试（框架 3 个 + test_ffmpeg_executor + test_store[MySQL 不可达 SKIP]）
#   integration 容器集成测试（compose 全链路，Dockerfile 的唯一真实验证点）+ 业务 RPC 压测
#   benchmark   RPC 压测（bench_rpc_stress --direct --keepalive）
#
# 二进制通过 artifact 在 job 间复用，避免重复编译。
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libprotobuf-dev protobuf-compiler \
            libzookeeper-mt-dev \
            libmysqlclient-dev \
            libhiredis-dev \
            librabbitmq-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_NATIVE_MARCH=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin/
          retention-days: 1

  unit-test:
    name: Unit tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # v4 平铺下载到指定 path：upload-artifact 上传 bin/ 时只含目录内容（无 bin 前缀），
      # 不指定 path 会解到工作区根 → ./bin/* 全部找不到（上一版 CI 失败根因）
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      # 二进制动态链接全部中间件库（缺一个就加载失败），与 Dockerfile runtime 包列表保持一致
      # ffmpeg 供 test_ffmpeg_executor 真实转码（testsrc fixture）
      - name: Install runtime deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libprotobuf32t64 libzookeeper-mt2 libmysqlclient21 libhiredis1.1.0 librabbitmq4 \
          ffmpeg

      - name: Run unit tests
        run: |
          mkdir -p program_log
          ./bin/test_buffer
          ./bin/test_threadpool
          ./bin/test_rpc_protocol
          ./bin/test_ffmpeg_executor
          # test_store 需 MySQL，本 job 无 MySQL → 自动 SKIP 退出 0
          ./bin/test_store

  integration:
    name: Integration (docker compose)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # integration_test.sh 在宿主上用 ffmpeg 生成测试视频（testsrc），runner 未预装
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # 必须在 compose up 之前预创建挂载目录：compose 对不存在的目录会以 root 创建，
      # 之后 ffmpeg（runner 用户）写 data/videos 被拒 → Permission denied（上版 CI 失败根因）
      - name: Prepare mount dirs for data volumes
        run: mkdir -p data/videos data/output

      - name: Build & start full stack
        run: docker compose up -d --build

      - name: Run integration test
        run: ./scripts/integration_test.sh

      # 业务 RPC 压测：容器内直连各服务端口（127.0.0.1 即本服务），纯读/无副作用
      - name: Run business RPC stress benchmark
        run: |
          docker compose exec -T job_service \
            ./bin/bench_biz_stress --direct --keepalive --method query_job -c 50 -m 200
          docker compose exec -T worker_manager \
            ./bin/bench_biz_stress --direct --keepalive --method heartbeat -c 50 -m 200

      - name: Dump service logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v

  benchmark:
    name: RPC benchmark
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 同 unit-test：v4 平铺下载，必须指定 path: bin 才有 ./bin/* 路径
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      # 二进制动态链接全部中间件库（缺一个就加载失败），与 Dockerfile runtime 包列表保持一致
      - name: Install runtime deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libprotobuf32t64 libzookeeper-mt2 libmysqlclient21 libhiredis1.1.0 librabbitmq4

      - name: Run RPC stress benchmark
        run: |
          mkdir -p program_log
          ./bin/rpc_echo_server -i test/conf/rpc_test.conf &
          SERVER_PID=$!
          sleep 3
          ./bin/bench_rpc_stress --direct --keepalive -c 50 -m 200 -s 64
          RC=$?
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $RC
